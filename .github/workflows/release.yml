name: Release

# Tag-driven: `git tag -a v1.0.0 && git push origin v1.0.0` builds a .dmg and publishes it.
# The tag must match the version in Resources/Info.plist, so the asset name, the app and the release
# can never disagree.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build .dmg and publish
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Tag matches the app version
        run: |
          TAG="${RELEASE_TAG#v}"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $RELEASE_TAG does not match CFBundleShortVersionString ($VERSION) — bump it with ./scripts/bump-version.sh"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Build the .dmg
        run: ./scripts/build-app.sh --dmg

      - name: Checksum
        # Relative name only, so `shasum -a 256 -c sha256.txt` works in the directory the files land in.
        working-directory: build
        run: shasum -a 256 *.dmg | tee sha256.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" build/*.dmg build/sha256.txt \
            --title "Discord RP $RELEASE_TAG" \
            --notes-file .github/release-notes.md
